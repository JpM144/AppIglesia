{% extends 'basePartidas.html' %}


{% block title %}Eliminar País{% endblock %}

{% block content %}
    <div class="delete-container">
        <div class="delete-card">
            <div class="delete-header">
                <i class="bi bi-trash-fill"></i> Eliminar País
            </div>
            <div class="delete-body">
                <div class="alert-danger-box">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <p>¿Estás seguro de que deseas eliminar <strong>{{ pais.nombre_Pais }}</strong>?</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn-delete">
                        <i class="bi bi-trash"></i> Eliminar
                    </button>
                    <a href="{% url 'lista_paises' %}" class="btn-cancel">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>

    <style>
        body {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        .delete-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .delete-header {
            font-size: 22px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .alert-danger-box {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .btn-delete {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            transition: 0.3s;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .btn-cancel {
            display: block;
            width: 100%;
            padding: 10px;
            background: #7f8c8d;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-cancel:hover {
            background: #636e72;
        }
    </style>
{% endblock %}
